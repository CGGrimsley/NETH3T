; NETH3T — handheld anti-drone & LoRa detector
; Target: LilyGO T-Display-S3-Pro + MVSRLora back plate (LR1121)

[platformio]
default_envs = t-display-s3-pro-lr1121

[env:t-display-s3-pro-lr1121]
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
lib_deps =
  jgromes/RadioLib @ 7.8.1
  moononournation/GFX Library for Arduino @ 1.4.9
  lewisxhe/SensorLib @ 0.5.0
  lewisxhe/XPowersLib @ 0.3.3
  h2zero/NimBLE-Arduino @ 2.5.1

; Host-side unit tests for the pure (hardware-free) modules
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<core/target_db.cpp> +<detect/> +<alert/alert_policy.cpp> +<log/csv_format.cpp> +<ui/geo.cpp>
build_flags = -std=gnu++17 -Iinclude -Isrc -Itest -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
